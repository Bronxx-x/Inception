services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb-container
    restart: always
    env_file: .env
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    expose:
      - "3306"

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress-container
    restart: always
    depends_on:
      - mariadb
    env_file: .env
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
    expose:
      - "9000"

  nginx:
    build: ./requirements/nginx
    container_name: nginx-container
    restart: always
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
      - ./srcs/conf/ssl:/etc/nginx/ssl
      - ./requirements/nginx/tools/start-nginx.sh:/usr/local/bin/start-nginx.sh

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  wordpress_data:
    driver: local
